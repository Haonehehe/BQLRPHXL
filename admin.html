<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · BQLRPH Xuân Lộc</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
  --bg:#eef2f7; --card:#fff; --bd:#e2e8f0; --tx:#0f172a; --mu:#64748b;
  --amber:#d97706; --green:#059669; --sky:#0284c7; --violet:#7c3aed; --rose:#e11d48;
  --r:18px; --shadow:0 8px 30px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--tx);min-height:100vh;
  background:
    radial-gradient(1000px 480px at -10% -20%, rgba(251,191,36,.14), transparent 55%),
    radial-gradient(800px 400px at 110% 0%, rgba(14,165,233,.1), transparent 50%),
    radial-gradient(600px 300px at 50% 100%, rgba(16,185,129,.06), transparent 50%),
    var(--bg);
  padding-bottom:56px;
}
button{cursor:pointer;border:none;background:none;font:inherit}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.main{padding-top:8px}

/* ===== TOP ===== */
.top{
  background:rgba(255,255,255,.88);backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(226,232,240,.9);
  position:sticky;top:0;z-index:50;
  box-shadow:0 4px 24px rgba(15,23,42,.04);
}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px;flex-wrap:wrap;padding:12px 0}
.logo{display:flex;align-items:center;gap:14px}
.logo-i{
  width:46px;height:46px;border-radius:15px;
  background:linear-gradient(145deg,#fbbf24,#d97706);color:#fff;
  display:grid;place-items:center;font-size:18px;
  box-shadow:0 10px 24px rgba(217,119,6,.32);
}
.logo h1{font-size:16px;font-weight:800;letter-spacing:-.03em}
.logo p{font-size:11.5px;color:var(--mu);margin-top:2px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;
  border-radius:12px;font-size:12.5px;font-weight:600;transition:.15s;text-decoration:none;
}
.btn:active{transform:scale(.97)}
.btn-o{background:#fff;border:1px solid var(--bd);color:#334155}
.btn-o:hover{background:#f8fafc;border-color:#cbd5e1}
.btn-g{background:linear-gradient(135deg,#10b981,#047857);color:#fff;box-shadow:0 6px 16px rgba(5,150,105,.28)}
.btn-r{background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff}
.btn-v{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff}
.btn-a{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.btn-dark{background:#0f172a;color:#fff}
.btn-dark:hover{background:#1e293b}
.btn-sm{height:32px;padding:0 11px;font-size:11.5px;border-radius:10px}

/* ===== ZONES ===== */
.zone{
  margin:18px 0 22px;
  background:rgba(255,255,255,.55);
  border:1px solid rgba(226,232,240,.85);
  border-radius:22px;
  padding:16px;
  box-shadow:var(--shadow);
}
.zone-h{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:0 2px}
.zone-ico{
  width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
  color:#fff;font-size:16px;flex-shrink:0;
}
.z-amber{background:linear-gradient(145deg,#fbbf24,#d97706);box-shadow:0 8px 18px rgba(217,119,6,.25)}
.z-green{background:linear-gradient(145deg,#34d399,#059669);box-shadow:0 8px 18px rgba(5,150,105,.25)}
.z-sky{background:linear-gradient(145deg,#38bdf8,#0284c7);box-shadow:0 8px 18px rgba(2,132,199,.25)}
.z-violet{background:linear-gradient(145deg,#a78bfa,#7c3aed);box-shadow:0 8px 18px rgba(124,58,237,.25)}
.zone-t{font-size:15px;font-weight:800;letter-spacing:-.02em}
.zone-d{font-size:12px;color:var(--mu);margin-top:2px}

/* ===== KPIs ===== */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{
  background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px 14px;
  display:flex;align-items:center;gap:12px;transition:.15s;
}
.kpi:hover{border-color:#cbd5e1;transform:translateY(-1px)}
.kpi-ico{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:15px;flex-shrink:0;
}
.k1 .kpi-ico{background:#fff7ed;color:#c2410c}
.k2 .kpi-ico{background:#fffbeb;color:#d97706}
.k3 .kpi-ico{background:#ecfdf5;color:#059669}
.k4 .kpi-ico{background:#eff6ff;color:#2563eb}
.kpi .l{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mu)}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:2px;color:var(--tx)}
.k2 .v{color:#d97706}
.k4 .v{color:#2563eb}

/* ===== PANELS (accordion) ===== */
.panel{
  background:#fff;border:1px solid var(--bd);border-radius:16px;margin-bottom:10px;overflow:hidden;
}
.panel-h{
  width:100%;padding:13px 15px;display:flex;justify-content:space-between;align-items:center;
  font-size:13px;font-weight:700;color:var(--tx);text-align:left;gap:10px;
  background:#fff;transition:background .12s;
}
.panel-h:hover{background:#f8fafc}
.panel-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel-b{display:none;border-top:1px solid #f1f5f9}
.panel.open .panel-b{display:block}
.panel.open .chev{transform:rotate(180deg)}
.chev{color:#94a3b8;font-size:12px;transition:transform .2s}

.c-amber{color:#d97706}.c-green{color:#059669}.c-sky{color:#0284c7}.c-violet{color:#7c3aed}
.pill-red{
  display:inline-flex;min-width:20px;height:20px;padding:0 6px;border-radius:999px;
  background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;font-size:10px;font-weight:800;
  align-items:center;justify-content:center;
}
.pill-mute{
  display:inline-flex;padding:2px 8px;border-radius:999px;background:#f1f5f9;color:#64748b;
  font-size:11px;font-weight:700;
}

/* legacy acc alias */
.acc{background:#fff;border:1px solid var(--bd);border-radius:16px;margin-bottom:10px;overflow:hidden}
.acc-h{padding:13px 15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:13px;font-weight:700}
.acc-b{display:none;border-top:1px solid #f1f5f9}
.acc.open .acc-b{display:block}
.acc.open .chev{transform:rotate(180deg)}
.badge-dot-live{display:inline-flex;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#e11d48;color:#fff;font-size:10px;font-weight:800;align-items:center;justify-content:center}

/* Users */
.user{padding:15px 16px;border-bottom:1px solid #f1f5f9;display:grid;gap:11px}
.user:hover{background:#fafbfc}
.user:last-child{border-bottom:none}
.user .row1{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.user .name{font-weight:700;font-size:14px}
.user .meta{font-size:12px;color:var(--mu);margin-top:3px}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:700;border:1px solid;margin-left:6px}
.tag.pending{background:#fffbeb;color:#b45309;border-color:#fde68a}
.tag.approved{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.tag.rejected{background:#fff1f2;color:#e11d48;border-color:#fecdd3}
.tag.disabled{background:#f1f5f9;color:#64748b;border-color:#e2e8f0}
.tag.admin{background:#f5f3ff;color:#6d28d9;border-color:#ddd6fe}
.perms{display:flex;flex-wrap:wrap;gap:7px}
.perms label{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;
  padding:6px 10px;border:1px solid var(--bd);border-radius:10px;background:#f8fafc;cursor:pointer;
}
.perms label:hover{border-color:#fcd34d;background:#fffbeb}
.perms input{accent-color:#d97706}
.acts{display:flex;flex-wrap:wrap;gap:6px}

.tb-item{padding:14px 16px;border-bottom:1px solid #f1f5f9;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between}
.tb-item:last-child{border-bottom:none}
.tb-item .t{font-weight:700;font-size:13.5px;line-height:1.35}
.tb-item .m{font-size:12px;color:var(--mu);margin-top:4px}
.tb-item.hidden-row{opacity:.5}

.panel-b input[type=text],.panel-b input[type=url],.panel-b input[type=date],
.panel-b input[type=password],.panel-b select,.panel-b textarea,
.acc-b input[type=text],.acc-b input[type=url],.acc-b input[type=date],.acc-b select,.acc-b textarea{
  width:100%;border:1px solid var(--bd);border-radius:11px;padding:0 12px;
  font-size:13px;font-family:inherit;background:#fff;color:var(--tx);
}
.panel-b input[type=text],.panel-b input[type=url],.panel-b input[type=date],.panel-b select,
.acc-b input[type=text],.acc-b input[type=url],.acc-b input[type=date],.acc-b select{height:40px}
.panel-b textarea,.acc-b textarea{padding:10px 12px;resize:vertical}
.panel-b label,.acc-b label{font-size:11px;font-weight:700;color:var(--mu)}

.empty{padding:28px 16px;text-align:center;color:var(--mu);font-size:13px}
.loading{padding:64px;text-align:center;color:var(--mu)}
.note{display:none}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;margin-bottom:10px;overflow:hidden}
.card-h{padding:13px 15px;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}

.gate{
  max-width:420px;margin:100px auto;background:#fff;border:1px solid var(--bd);
  border-radius:22px;padding:36px;text-align:center;box-shadow:0 20px 50px rgba(15,23,42,.08);
}
.gate h2{font-size:18px;margin-bottom:8px}
.gate p{color:var(--mu);font-size:13px;margin-bottom:18px;line-height:1.5}

.toast{
  position:fixed;bottom:22px;right:22px;background:#0f766e;color:#fff;
  padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;
  box-shadow:0 12px 32px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:.2s;z-index:100;
}
.toast.on{opacity:1}

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ===== BQLRPH Auth (Google Sheet via Apps Script + local fallback) ===== */
var CONFIG = {
  // Dán Web App URL sau khi Deploy Apps Script (kết thúc bằng /exec)
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbxuJbK3_-8105VI5dWHkQCiR6BKUMmrf1RM33fQ6hbl9OGh06hGBk62shVWX3h2lBJC7g/exec',
  // Ví dụ: 'https://script.google.com/macros/s/AKfycbx.../exec'
};


/* ===== Nguồn Google Sheet dùng chung (admin cấu hình → mọi user) ===== */
var SHEET_CFG_KEY='bqlrph_sheet_sources_v1';
var DEFAULT_SHEET_SOURCES={
  qlbvr:{sid:'1b_Ij0xiVztYMMofozsG95etHC3qdOS36n1fnTbKX5bU',gid:'528762373',label:'QLBVR'},
  lamba:{sid:'1CnlGELkhVjLEa7jQwVg4kIeyiXxqmOTR',gidDN:'1710752621',gidLD:'516720069',gidTH:'149303770',label:'Lâm bạ'},
  nhao:{sid:'1oQEEMiTMYZwrsoIXZdNtat4cjoaku5NT',label:'Nhà ở'},
  mocgioi:{sid:'1XOz-KdIhtWIyocSrV8ZvpOgusTLUOGCX',gid:'1646240187',label:'Mốc giới'},
  trongrung:{sid:'10ATqYxnFgsL1z7_QgOO4Ilt3oVGyHGk7',gid:'1027488994',label:'Trồng & chăm sóc rừng'},
  tasks:{sid:'1rJwDYJQQP6JBhjBLlZqnCCy7AD8z3bUe',gid:'1800611191',label:'Nhiệm vụ / Gantt'},
  tonghop:{sid:'1nP0UPmkija86oqcjHh66uoO77zKcawTB',gid:'688529358',label:'Tổng hợp đường dẫn'}
};
function loadSheetSourcesLocal(){
  try{
    var raw=localStorage.getItem(SHEET_CFG_KEY);
    if(raw){ var o=JSON.parse(raw); if(o&&typeof o==='object') return o; }
  }catch(e){}
  return null;
}
function saveSheetSourcesLocal(cfg){
  try{ localStorage.setItem(SHEET_CFG_KEY, JSON.stringify(cfg)); }catch(e){}
}
function mergeSheetSources(remote){
  var base=JSON.parse(JSON.stringify(DEFAULT_SHEET_SOURCES));
  var loc=loadSheetSourcesLocal()||{};
  [loc, remote||{}].forEach(function(src){
    Object.keys(src||{}).forEach(function(k){
      if(!src[k]||typeof src[k]!=='object') return;
      base[k]=base[k]||{};
      Object.keys(src[k]).forEach(function(f){
        if(src[k][f]!=null && String(src[k][f]).trim()!=='') base[k][f]=src[k][f];
      });
    });
  });
  return base;
}
function getSheetSources(){ return mergeSheetSources(null); }
function fetchSheetSourcesCloud(){
  if(typeof useCloud==='function' && useCloud() && typeof apiCall==='function'){
    return apiCall({action:'getsheets'}).then(function(res){
      if(res && res.ok && res.sheets){
        saveSheetSourcesLocal(res.sheets);
        return mergeSheetSources(res.sheets);
      }
      return getSheetSources();
    }).catch(function(){ return getSheetSources(); });
  }
  return Promise.resolve(getSheetSources());
}
function pushSheetSourcesCloud(cfg){
  saveSheetSourcesLocal(cfg);
  if(typeof useCloud==='function' && useCloud() && typeof apiCall==='function'){
    var c={};
    try{ if(typeof adminCred==='function') c=adminCred(); }catch(e){}
    return apiCall({
      action:'setsheets', sheets:cfg,
      adminEmail:c.adminEmail||'', adminPass:c.adminPass||''
    }).then(function(res){
      if(res && res.ok) return true;
      var msg=(res&&res.error)||'';
      if(/unknown action/i.test(msg)){
        msg='Apps Script chưa deploy bản có getsheets/setsheets. Mở script → dán full code → Deploy → New version. Đã lưu tạm trên máy admin.';
      } else if(!msg){
        msg='Máy chủ chưa hỗ trợ setsheets — đã lưu trên trình duyệt admin.';
      }
      throw new Error(msg);
    });
  }
  return Promise.resolve(true);
}

var AUTH_KEY = 'bqlrph_auth_v1';
var SESS_KEY = 'bqlrph_session_v1';
var DEFAULT_ADMIN = { email: 'admin@bqlrph.local', name: 'Quản trị viên', pass: 'Admin@2026' };
var ALL_PERMS = ['qlbvr', 'lamba', 'nhao', 'mocgioi', 'trongrung', 'tasks', 'tonghop', 'pdf'];
var PERM_LABEL = { qlbvr: 'QLBVR', lamba: 'Lâm bạ / Đất đai', nhao: 'Nhà ở', mocgioi: 'Mốc giới', trongrung: 'Trồng & chăm sóc', tasks: 'Nhiệm vụ / Gantt', tonghop: 'Tổng hợp đường dẫn', pdf: 'Công cụ PDF' };

function useCloud() {
  return !!(CONFIG.SCRIPT_URL && CONFIG.SCRIPT_URL.indexOf('http') === 0);
}

function apiCall(payload) {
  return fetch(CONFIG.SCRIPT_URL, {
    method: 'POST',
    // text/plain tránh preflight CORS phức tạp với Apps Script
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    redirect: 'follow'
  }).then(function (r) { return r.text(); }).then(function (t) {
    try { return JSON.parse(t); } catch (e) { throw new Error('Phản hồi API không hợp lệ'); }
  });
}

function _loadDB() {
  try {
    var raw = localStorage.getItem(AUTH_KEY);
    if (raw) { var db = JSON.parse(raw); if (db && Array.isArray(db.users)) return db; }
  } catch (e) {}
  var db = {
    users: [{
      id: 'u_admin', email: DEFAULT_ADMIN.email, name: DEFAULT_ADMIN.name,
      pass: DEFAULT_ADMIN.pass, status: 'approved', role: 'admin',
      perms: ALL_PERMS.slice(), created: new Date().toISOString(), approvedAt: new Date().toISOString()
    }]
  };
  _saveDB(db);
  return db;
}
function _saveDB(db) { localStorage.setItem(AUTH_KEY, JSON.stringify(db)); }

function getSession(){try{var raw=sessionStorage.getItem(SESS_KEY);if(raw)return JSON.parse(raw);raw=localStorage.getItem(SESS_KEY);if(raw){sessionStorage.setItem(SESS_KEY,raw);return JSON.parse(raw);}}catch(e){}return null;}
function setSession(s){if(s){var j=JSON.stringify(s);sessionStorage.setItem(SESS_KEY,j);try{localStorage.setItem(SESS_KEY,j);}catch(e){}}else{sessionStorage.removeItem(SESS_KEY);try{localStorage.removeItem(SESS_KEY);}catch(e){}}}
function currentUser() { return getSession(); }
function isAdmin() { var s = getSession(); return !!(s && s.role === 'admin'); }
function canAccess(mod) {
  if (mod === 'pdf') return true;
  var s = getSession();
  if (!s) return false;
  if (s.role === 'admin') return true;
  return Array.isArray(s.perms) && s.perms.indexOf(mod) >= 0;
}
function logoutUser() { setSession(null); }

function adminCred() {
  var s = getSession();
  if (!s || s.role !== 'admin') throw new Error('Cần đăng nhập admin');
  // Lưu pass tạm trong session khi login (chỉ để gọi API admin)
  return { adminEmail: s.email, adminPass: s._pass || '' };
}

/* ---- Register / Login ---- */
function registerUser(name, email, pass) {
  name = String(name || '').trim();
  email = String(email || '').trim().toLowerCase();
  pass = String(pass || '');
  if (!name || name.length < 2) throw new Error('Nhập họ tên hợp lệ');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error('Email không hợp lệ');
  if (pass.length < 6) throw new Error('Mật khẩu tối thiểu 6 ký tự');

  if (useCloud()) {
    return apiCall({ action: 'register', name: name, email: email, pass: pass }).then(function (res) {
      if (!res.ok) throw new Error(res.error || 'Đăng ký thất bại');
      return true;
    });
  }
  var db = _loadDB();
  if (db.users.some(function (u) { return u.email === email; })) throw new Error('Email đã được đăng ký');
  db.users.push({
    id: 'u_' + Date.now(), email: email, name: name, pass: pass,
    status: 'pending', role: 'user', perms: ['pdf'],
    created: new Date().toISOString(), approvedAt: null
  });
  _saveDB(db);
  return Promise.resolve(true);
}

function loginUser(email, pass) {
  email = String(email || '').trim().toLowerCase();
  pass = String(pass || '');

  if (useCloud()) {
    return apiCall({ action: 'login', email: email, pass: pass }).then(function (res) {
      if (!res.ok) throw new Error(res.error || 'Đăng nhập thất bại');
      var u = res.user;
      var sess = {
        email: u.email, name: u.name, role: u.role || 'user',
        perms: u.perms || ['pdf'], loginAt: new Date().toISOString(),
        _pass: pass // dùng cho thao tác admin trên API
      };
      setSession(sess);
      return sess;
    });
  }
  var db = _loadDB();
  var u = db.users.find(function (x) { return x.email === email; });
  if (!u || u.pass !== pass) return Promise.reject(new Error('Email hoặc mật khẩu không đúng'));
  if (u.status === 'pending') return Promise.reject(new Error('Tài khoản đang chờ admin duyệt'));
  if (u.status === 'rejected') return Promise.reject(new Error('Tài khoản đã bị từ chối'));
  if (u.status === 'disabled') return Promise.reject(new Error('Tài khoản đã bị khóa'));
  var sess = {
    email: u.email, name: u.name, role: u.role || 'user',
    perms: u.perms || ['pdf'], loginAt: new Date().toISOString(), _pass: pass
  };
  setSession(sess);
  return Promise.resolve(sess);
}


function fmtDateSafe(v){
  if(v==null || v==='') return '';
  if(typeof v==='number' && isFinite(v)){
    // Google Sheet serial date
    var ms = Math.round((v - 25569) * 86400 * 1000);
    var d = new Date(ms);
    if(!isNaN(d.getTime())) return d.toLocaleString('vi-VN');
  }
  var s = String(v).trim();
  if(!s) return '';
  // already locale-ish
  if(/Invalid/i.test(s)) return '';
  var d = new Date(s);
  if(!isNaN(d.getTime())) return d.toLocaleString('vi-VN');
  // dd/mm/yyyy or dd-mm-yyyy
  var m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){
    d = new Date(+m[3], +m[2]-1, +m[1], +(m[4]||0), +(m[5]||0), +(m[6]||0));
    if(!isNaN(d.getTime())) return d.toLocaleString('vi-VN');
  }
  return s;
}
function normalizePerms(p){
  var valid = ALL_PERMS.slice();
  var arr;
  if(Array.isArray(p)) arr = p;
  else if(p==null || p==='') arr = [];
  else arr = String(p).split(/[,;|\/]/);
  var out = [];
  arr.forEach(function(x){
    x = String(x||'').trim().toLowerCase();
    if(valid.indexOf(x)>=0 && out.indexOf(x)<0) out.push(x);
  });
  if(out.indexOf('pdf')<0) out.push('pdf');
  return out;
}
function looksLikePermList(v){
  var s = String(v==null?'':v).toLowerCase();
  return /\b(qlbvr|lamba|nhao|mocgioi|trongrung|tasks|pdf)\b/.test(s);
}
function extractPermsFromUser(u){
  u = u || {};
  if(looksLikePermList(u.perms)) return normalizePerms(u.perms);
  if(looksLikePermList(u.created)) return normalizePerms(u.created);
  if(looksLikePermList(u.permissions)) return normalizePerms(u.permissions);
  return normalizePerms(u.perms);
}
function normalizeUser(u, i){
  u = u || {};
  u.id = u.id || ('u_' + i + '_' + (u.email || ''));
  u.email = String(u.email || '').trim().toLowerCase();
  u.name = u.name || u.fullName || u.hoTen || u.email || '';
  u.status = String(u.status || 'pending').toLowerCase();
  u.role = String(u.role || 'user').toLowerCase();
  // API từng trả perms = tên đơn vị, created = 'qlbvr,lamba,...'
  u.perms = extractPermsFromUser(u);
  var createdRaw = u.created || u.createdAt || u.created_at || u.registeredAt || u.time || '';
  if(looksLikePermList(createdRaw)) createdRaw = u.approvedAt || '';
  u.created = createdRaw;
  u.createdLabel = fmtDateSafe(u.created) || fmtDateSafe(u.approvedAt);
  return u;
}

function listUsers() {
  if (useCloud()) {
    var c = adminCred();
    return apiCall({
      action: 'list', adminEmail: c.adminEmail, adminPass: c.adminPass
    }).then(function (res) {
      if (!res.ok) throw new Error(res.error || 'Không tải được danh sách');
      return (res.users || []).map(function (u, i) {
        return normalizeUser(u, i);
      });
    });
  }
  return Promise.resolve(_loadDB().users.slice().map(function(u,i){return normalizeUser(u,i);}).sort(function (a, b) {
    return String(b.created || '').localeCompare(String(a.created || ''));
  }));
}

function approveUser(email, perms, asAdmin) {
  if (useCloud()) {
    var c = adminCred();
    return apiCall({
      action: 'approve', adminEmail: c.adminEmail, adminPass: c.adminPass,
      email: email, perms: perms, asAdmin: !!asAdmin
    }).then(function (res) {
      if (!res.ok) throw new Error(res.error || 'Duyệt thất bại');
      return true;
    });
  }
  var db = _loadDB();
  var u = db.users.find(function (x) { return x.email === email; });
  if (!u) return Promise.reject(new Error('Không tìm thấy user'));
  u.status = 'approved';
  u.approvedAt = new Date().toISOString();
  u.perms = Array.isArray(perms) && perms.length ? perms.slice() : ['pdf'];
  if (u.perms.indexOf('pdf') < 0) u.perms.push('pdf');
  if (asAdmin) { u.role = 'admin'; u.perms = ALL_PERMS.slice(); }
  _saveDB(db);
  return Promise.resolve(true);
}

function changePassword(email, oldP, newP) {
  email = String(email || '').trim().toLowerCase();
  oldP = String(oldP || '');
  newP = String(newP || '');
  if (newP.length < 6) return Promise.reject(new Error('Mật khẩu mới tối thiểu 6 ký tự'));
  if (useCloud()) {
    return apiCall({ action: 'changepass', email: email, oldPass: oldP, newPass: newP }).then(function (res) {
      if (!res.ok) throw new Error(res.error || 'Đổi mật khẩu thất bại');
      var s = getSession();
      if (s && s.email === email) { s._pass = newP; setSession(s); }
      return true;
    });
  }
  var db = _loadDB();
  var u = db.users.find(function (x) { return x.email === email; });
  if (!u || u.pass !== oldP) return Promise.reject(new Error('Mật khẩu cũ không đúng'));
  u.pass = newP;
  _saveDB(db);
  var s = getSession();
  if (s && s.email === email) { s._pass = newP; setSession(s); }
  return Promise.resolve(true);
}

function submitThongbao(){
  var title=String((document.getElementById('tbTitle')||{}).value||'').trim();
  if(!title){ toast('Nhập tiêu đề'); return; }
  var sess=null; try{ sess=JSON.parse(sessionStorage.getItem('bqlrph_session_v1')||localStorage.getItem('bqlrph_session_v1')||'null'); }catch(e){}
  var payload={
    action:'addthongbao',
    adminEmail:(sess&&sess.email)||'',
    adminPass:(sess&&sess._pass)||'',
    type:(document.getElementById('tbType')||{}).value||'thongbao',
    title:title,
    body:(document.getElementById('tbBody')||{}).value||'',
    link:(document.getElementById('tbLink')||{}).value||'',
    image:(document.getElementById('tbImage')||{}).value||'',
    date:(document.getElementById('tbDate')||{}).value||'',
    exp:(document.getElementById('tbExp')||{}).value||'',
    author:(document.getElementById('tbAuthor')||{}).value||((sess&&sess.name)||'Admin'),
    pin:!!(document.getElementById('tbPin')||{}).checked,
    show:document.getElementById('tbShow')?!!document.getElementById('tbShow').checked:true
  };
  function saveDraft(){
    try{ var key='bqlrph_thongbao_drafts'; var arr=JSON.parse(localStorage.getItem(key)||'[]'); arr.unshift({ts:Date.now(),data:payload}); localStorage.setItem(key, JSON.stringify(arr.slice(0,50))); }catch(e){}
  }
  function readFileAsB64(file){
    return new Promise(function(resolve,reject){
      if(!file) return resolve(null);
      if(file.size > 8*1024*1024) return reject(new Error('File "'+file.name+'" vượt 8MB — hãy tải lên Drive rồi dán link'));
      var r=new FileReader();
      r.onload=function(){
        var s=String(r.result||'');
        var i=s.indexOf(',');
        resolve({ name:file.name, mime:file.type||'application/octet-stream', base64: i>=0?s.slice(i+1):s });
      };
      r.onerror=function(){ reject(new Error('Không đọc được file '+file.name)); };
      r.readAsDataURL(file);
    });
  }
  var fEl=document.getElementById('tbFile');
  var iEl=document.getElementById('tbImgFile');
  var f1=fEl&&fEl.files&&fEl.files[0];
  var f2=iEl&&iEl.files&&iEl.files[0];
  toast('Đang xử lý'+(f1||f2?' file…':'…'));
  Promise.all([readFileAsB64(f1), readFileAsB64(f2)]).then(function(arr){
    if(arr[0]) payload.fileUpload=arr[0];
    if(arr[1]) payload.imageUpload=arr[1];
    if(typeof useCloud==='function' && useCloud() && typeof apiCall==='function'){
      return apiCall(payload).then(function(res){
        if(res&&res.ok){
          toast('Đã đăng tin'+(res.link||res.image?' · đã lưu file Drive':''));
          clearThongbaoForm();
          loadThongbaoPosts();
          if(fEl) fEl.value='';
          if(iEl) iEl.value='';
        } else {
          saveDraft();
          toast((res&&res.error)||'Script chưa hỗ trợ upload — cập nhật Apps Script (xem APPS_SCRIPT_THONGBAO.md)');
        }
      });
    }
    saveDraft();
    toast('Cần Apps Script (addthongbao + Drive) để tải file trực tiếp');
  }).catch(function(e){ toast(e.message||String(e)); });
}

}
function toggleThongbaoRow(row, show){
  var c=adminCred();
  apiCall({action:'hidethongbao', row:row, show:show, adminEmail:c.adminEmail, adminPass:c.adminPass}).then(function(res){
    if(res&&res.ok){ toast(show?'Đã hiện tin':'Đã ẩn tin'); loadThongbaoPosts(); }
    else toast((res&&res.error)||'Lỗi cập nhật');
  }).catch(function(e){ toast(e.message||e); });
}

function parseSidFromInput(v){
  v=String(v||'').trim();
  var m=v.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  if(m) return m[1];
  if(/^[a-zA-Z0-9-_]{20,}$/.test(v)) return v;
  return v;
}
function parseGidFromInput(v){
  v=String(v||'').trim();
  var m=v.match(/[?&#]gid=([0-9]+)/);
  if(m) return m[1];
  if(/^[0-9]+$/.test(v)) return v;
  return v;
}
function saveSheetSourcesUI(){
  var cfg=getSheetSources();
  document.querySelectorAll('input[data-sk]').forEach(function(inp){
    var k=inp.getAttribute('data-sk'), f=inp.getAttribute('data-sf');
    if(!cfg[k]) cfg[k]={};
    var val=inp.value.trim();
    if(f==='sid'||f.indexOf('sid')>=0) val=parseSidFromInput(val);
    else if(f.indexOf('gid')>=0||f==='gid') val=parseGidFromInput(val);
    cfg[k][f]=val;
  });
  pushSheetSourcesCloud(cfg).then(function(){
    toast('Đã lưu nguồn Sheet lên máy chủ — user khác mở lại module sẽ nhận link mới');
  }).catch(function(e){
    toast(e.message||String(e));
  });
}
function resetSheetSourcesUI(){
  if(!confirm('Khôi phục nguồn Sheet mặc định trong code?')) return;
  saveSheetSourcesLocal(DEFAULT_SHEET_SOURCES);
  pushSheetSourcesCloud(DEFAULT_SHEET_SOURCES).then(function(){
    toast('Đã về mặc định'); loadUsers();
  }).catch(function(){ toast('Đã về mặc định (local)'); loadUsers(); });
}


function fetchOnlineUsers(){
  if(typeof useCloud==='function' && useCloud() && typeof apiCall==='function'){
    var c = (typeof adminCred==='function') ? adminCred() : { adminEmail:'', adminPass:'' };
    if(!c.adminEmail || !c.adminPass){
      // fallback session
      try{
        var s=JSON.parse(sessionStorage.getItem('bqlrph_session_v1')||localStorage.getItem('bqlrph_session_v1')||'null');
        if(s){ c.adminEmail=s.email||c.adminEmail; c.adminPass=s._pass||s.pass||s.password||c.adminPass; }
      }catch(e){}
    }
    return apiCall({
      action: 'listonline',
      adminEmail: c.adminEmail,
      adminPass: c.adminPass
    }).then(function(res){
      if(res && res.ok) return {
        online: res.online||[],
        recent: res.recent||[],
        fromServer: true
      };
      throw new Error((res && res.error) || 'listonline fail');
    }).catch(function(err){
      console.warn('listonline', err);
      var loc = readLocalPresence();
      loc.serverError = String(err && err.message || err || '');
      return loc;
    });
  }
  return Promise.resolve(readLocalPresence());
}

function readLocalPresence(){
  var online=[], recent=[];
  try{
    var all=JSON.parse(localStorage.getItem('bqlrph_presence_v1')||'{}');
    var now=Date.now();
    Object.keys(all).forEach(function(k){
      var u=all[k];
      var t=Date.parse(u.at||0);
      if(!t) return;
      var age=now-t;
      u.ageSec=Math.round(age/1000);
      if(age<=5*60*1000) online.push(u);
      else if(age<=60*60*1000) recent.push(u);
    });
  }catch(e){}
  return { online:online, recent:recent, localOnly:true };
}

function fmtAge(sec){
  if(sec==null) return '';
  if(sec<60) return sec+' giây trước';
  if(sec<3600) return Math.floor(sec/60)+' phút trước';
  return Math.floor(sec/3600)+' giờ trước';
}

function renderOnlineCard(pres){
  pres=pres||{online:[],recent:[]};
  var html='<div class="card onl-card"><div class="card-h"><span><i class="fa-solid fa-signal" style="color:#059669;margin-right:6px"></i>Đang online / vừa truy cập</span>'+
    '<button type="button" class="btn btn-o btn-sm" onclick="loadUsers()"><i class="fa-solid fa-arrows-rotate"></i> Làm mới</button></div>';
  if(pres.fromServer){
    html+='';
  } else if(pres.localOnly||pres.offline){
    html+='<div class="empty" style="padding:12px;font-size:12.5px;color:#9a3412;background:#fff7ed">Chưa đọc được server'+(pres.serverError?(' ('+esc(pres.serverError)+')'):'')+'. Kiểm tra SCRIPT_URL trùng URL Deploy, và admin đã lưu mật khẩu khi đăng nhập. Tạm hiện dữ liệu local.</div>';
  }
  if(!(pres.online||[]).length && !(pres.recent||[]).length){
    html+='<div class="empty">Chưa có user nào gửi tín hiệu. User cần mở <b>menu</b> khi đã đăng nhập.</div>';
  } else {
    (pres.online||[]).forEach(function(u){
      html+='<div class="onl-row"><span class="onl-dot" title="Online"></span><div class="onl-meta"><b>'+esc(u.name||u.email)+'</b><span>'+esc(u.email)+(u.unit?(' · '+esc(u.unit)):'')+(u.page?(' · '+esc(u.page)):'')+'</span></div><div class="onl-time">'+fmtAge(u.ageSec)+'</div></div>';
    });
    (pres.recent||[]).forEach(function(u){
      html+='<div class="onl-row"><span class="onl-dot off" title="Trong 1 giờ"></span><div class="onl-meta"><b>'+esc(u.name||u.email)+'</b><span>'+esc(u.email)+' · trong 1 giờ qua</span></div><div class="onl-time" style="color:#64748b">'+fmtAge(u.ageSec)+'</div></div>';
    });
  }
  html+='</div>';
  return html;
}


function pulsePresenceAdmin(){
  try{

    if(!s||!s.email) return;

      apiCall({action:'heartbeat', email:s.email, name:s.name||'', unit:s.unit||'', page:'admin.html'}).catch(function(){});

}

    listUsers(),

    var approved=users.filter(function(u){return u.status==='approved';}).length;

    var html='';

    // ===== ZONE: Tổng quan =====
    html+='<div class="zone">';
    html+='<div class="zone-h"><div class="zone-ico z-amber"><i class="fa-solid fa-chart-pie"></i></div><div><div class="zone-t">Tổng quan</div><div class="zone-d">'+esc(mode)+'</div></div></div>';
    html+='<div class="kpis">';
    html+='<div class="kpi k1"><div class="kpi-ico"><i class="fa-solid fa-users"></i></div><div><div class="l">Tổng tài khoản</div><div class="v">'+users.length+'</div></div></div>';
    html+='<div class="kpi k2"><div class="kpi-ico"><i class="fa-solid fa-clock"></i></div><div><div class="l">Chờ duyệt</div><div class="v">'+pending+'</div></div></div>';
    html+='<div class="kpi k3"><div class="kpi-ico"><i class="fa-solid fa-circle-check"></i></div><div><div class="l">Đã duyệt</div><div class="v">'+approved+'</div></div></div>';
    html+='<div class="kpi k4"><div class="kpi-ico"><i class="fa-solid fa-signal"></i></div><div><div class="l">Đang online</div><div class="v">'+(pres.online||[]).length+'</div></div></div>';
    html+='</div>';
    html+=renderOnlineCard(pres);
    html+='</div>';

    // ===== ZONE: Người dùng =====
    html+='<div class="zone">';
    html+='<div class="zone-h"><div class="zone-ico z-green"><i class="fa-solid fa-user-shield"></i></div><div><div class="zone-t">Người dùng & quyền</div><div class="zone-d">Duyệt đăng ký · cấp quyền module</div></div></div>';

    html+='<div class="panel'+(pending?' open':'')+'" id="acc-pending">';
    html+='<button type="button" class="panel-h" onclick="toggleAcc(\'acc-pending\')"><span class="panel-left"><i class="fa-solid fa-hourglass-half c-amber"></i> Chờ duyệt';
    if(pending) html+='<span class="pill-red">'+pending+'</span>';
    html+='</span><i class="fa-solid fa-chevron-down chev"></i></button><div class="panel-b">';
    var pend=users.filter(function(u){return u.status==='pending';});
    if(!pend.length) html+='<div class="empty">Không có yêu cầu mới</div>';
    pend.forEach(function(u,i){html+=userRow(u,'p'+i);});
    html+='</div></div>';

    html+='<div class="panel" id="acc-users">';
    html+='<button type="button" class="panel-h" onclick="toggleAcc(\'acc-users\')"><span class="panel-left"><i class="fa-solid fa-users c-green"></i> Tất cả tài khoản <span class="pill-mute">'+users.length+'</span></span><i class="fa-solid fa-chevron-down chev"></i></button><div class="panel-b">';
    users.forEach(function(u,i){html+=userRow(u,'a'+i);});
    html+='</div></div>';
    html+='</div>';

    // ===== ZONE: Nội dung =====
    html+='<div class="zone">';

    html+=thongbaoAdminCard();
    html+='<div class="panel open" id="acc-posts">';
    html+='<button type="button" class="panel-h" onclick="toggleAcc(\'acc-posts\')"><span class="panel-left"><i class="fa-solid fa-newspaper c-sky"></i> Tin đã đăng</span><i class="fa-solid fa-chevron-down chev"></i></button>';
    html+='<div class="panel-b" id="tbPostsBox"><div class="empty">Đang tải tin…</div></div></div>';
    html+='</div>';

    // ===== ZONE: Hệ thống =====
    html+='<div class="zone">';

function userRow(u,id){
  var st=u.status||'pending';
  var tags='<span class="tag '+st+'">'+st+'</span>';
  if(u.role==='admin') tags+='<span class="tag admin">admin</span>';
  var permsHtml='<div class="perms" id="perms_'+id+'">';
  ALL_PERMS.forEach(function(p){
    var ck=(u.perms||[]).indexOf(p)>=0?'checked':'';
    if(p==='pdf') ck='checked';
    var dis=p==='pdf'?' onclick="return false"':'';
    permsHtml+='<label><input type="checkbox" data-p="'+p+'" '+ck+dis+'> '+PERM_LABEL[p]+'</label>';
  });
  permsHtml+='</div>';
  var em=String(u.email||'').replace(/'/g,"\\'");
  var acts='<div class="acts">';
  if(st==='pending'){
    acts+='<button type="button" class="btn btn-g btn-sm" onclick="doApprove(\''+em+'\',\''+id+'\')"><i class="fa-solid fa-check"></i> Duyệt</button>';
    acts+='<button type="button" class="btn btn-r btn-sm" onclick="doReject(\''+em+'\')"><i class="fa-solid fa-xmark"></i> Từ chối</button>';
  } else if(st==='approved'){
    acts+='<button type="button" class="btn btn-v btn-sm" onclick="doSavePerms(\''+em+'\',\''+id+'\')"><i class="fa-solid fa-floppy-disk"></i> Lưu quyền</button>';
    acts+='<button type="button" class="btn btn-a btn-sm" onclick="doResetPass(\''+em+'\')"><i class="fa-solid fa-key"></i> Đặt lại MK</button>';
    if(u.email!==DEFAULT_ADMIN.email){
      acts+='<button type="button" class="btn btn-o btn-sm" onclick="doDisable(\''+em+'\')"><i class="fa-solid fa-ban"></i> Khóa</button>';
    }
  }
  acts+='</div>';
  return '<div class="user"><div class="row1"><div><div class="name">'+esc(u.name)+tags+'</div>'+
    '<div class="meta">'+esc(u.email)+((u.createdLabel||fmtDateSafe(u.created))?' · '+(u.createdLabel||fmtDateSafe(u.created)):'')+'</div></div>'+acts+'</div>'+permsHtml+'</div>';
}
function readPerms(id){
  var box=document.getElementById('perms_'+id),out=[];
  if(!box) return ['pdf'];
  box.querySelectorAll('input[type=checkbox]').forEach(function(inp){if(inp.checked)out.push(inp.getAttribute('data-p'));});
  if(out.indexOf('pdf')<0) out.push('pdf');
  return out;
}
function doApprove(email,id){approveUser(email,readPerms(id),false).then(function(){toast('Đã duyệt');loadUsers();}).catch(function(e){toast(e.message||e);});}
function doReject(email){if(!confirm('Từ chối '+email+'?'))return;rejectUser(email).then(function(){toast('Đã từ chối');loadUsers();}).catch(function(e){toast(e.message||e);});}
function doDisable(email){if(!confirm('Khóa '+email+'?'))return;disableUser(email).then(function(){toast('Đã khóa');loadUsers();}).catch(function(e){toast(e.message||e);});}
function doSavePerms(email,id){updatePerms(email,readPerms(id)).then(function(){toast('Đã lưu quyền');loadUsers();}).catch(function(e){toast(e.message||e);});}
function doResetPass(email){var np=prompt('Mật khẩu mới cho '+email+' (tối thiểu 6 ký tự):','');if(np==null)return;resetPassword(email,np).then(function(){toast('Đã đặt lại mật khẩu');}).catch(function(e){toast(e.message||e);});}

loadUsers();
