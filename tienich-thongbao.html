<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thông báo · Niêm yết — BQLRPH Xuân Lộc</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1220;--card:#151d2e;--card2:#1a2438;--line:rgba(148,163,184,.12);
  --tx:#e8eef7;--mu:#8b9bb4;--accent:#38bdf8;--ok:#34d399;
}
body{
  font-family:"Be Vietnam Pro",system-ui,sans-serif;min-height:100vh;color:var(--tx);
  background:
    radial-gradient(ellipse 80% 50% at 0% -20%,rgba(56,189,248,.14),transparent 55%),
    radial-gradient(ellipse 60% 40% at 100% 0%,rgba(52,211,153,.08),transparent 50%),
    var(--bg);
}
.wrap{max-width:880px;margin:0 auto;padding:22px 16px 56px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand h1{font-size:1.28rem;font-weight:800;letter-spacing:-.02em}
.brand p{color:var(--mu);font-size:.78rem;margin-top:4px}
.nav a{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;
  background:rgba(255,255,255,.05);color:var(--tx);text-decoration:none;font-size:.8rem;font-weight:600;
  border:1px solid var(--line);transition:.15s;
}
.nav a:hover{border-color:rgba(56,189,248,.4);background:rgba(56,189,248,.1)}
.toolbar{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;
  padding:12px;background:rgba(21,29,46,.9);border:1px solid var(--line);border-radius:16px;
  backdrop-filter:blur(12px);
}
.tabs{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.tab{
  border:1px solid transparent;background:rgba(255,255,255,.04);color:var(--mu);
  font:600 12px inherit;padding:7px 13px;border-radius:999px;cursor:pointer;transition:.15s;
}
.tab:hover{color:var(--tx)}
.tab.on{background:linear-gradient(135deg,#0ea5e9,#0369a1);color:#fff;box-shadow:0 4px 14px rgba(14,165,233,.3)}
.search-wrap{position:relative}
.search-wrap i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mu);font-size:12px}
.search{
  width:min(220px,100vw - 48px);height:36px;border-radius:11px;border:1px solid var(--line);
  background:rgba(11,18,32,.7);color:var(--tx);padding:0 12px 0 34px;font:500 13px inherit;outline:none;
}
.btn{
  height:36px;padding:0 13px;border-radius:11px;border:none;cursor:pointer;font:600 12px inherit;
  display:inline-flex;align-items:center;gap:6px;color:#fff;
  background:linear-gradient(135deg,#475569,#1e293b);
}
.btn:hover{filter:brightness(1.08)}
.meta{font-size:11px;color:var(--mu);margin:0 0 12px 4px}
.grid{display:flex;flex-direction:column;gap:14px}

.card{
  background:linear-gradient(165deg,rgba(30,41,59,.95),rgba(21,29,46,.98));
  border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,.22);transition:border-color .15s, transform .15s;
}
.card:hover{border-color:rgba(56,189,248,.28)}
.card.pin{border-color:rgba(251,191,36,.4);box-shadow:0 8px 32px rgba(251,191,36,.08)}
.card.expired{opacity:.55}
.card-body{padding:16px 18px 14px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-bottom:10px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  padding:4px 9px;border-radius:999px;border:1px solid transparent;
  display:inline-flex;align-items:center;gap:5px;
}
.b-thongbao{background:rgba(56,189,248,.12);color:#7dd3fc;border-color:rgba(56,189,248,.22)}
.b-niemyet{background:rgba(248,113,113,.12);color:#fca5a5;border-color:rgba(248,113,113,.25)}
.b-quantong{background:rgba(251,191,36,.12);color:#fcd34d;border-color:rgba(251,191,36,.28)}
.b-hoatdong{background:rgba(52,211,153,.12);color:#6ee7b7;border-color:rgba(52,211,153,.25)}
.b-pin{background:rgba(251,191,36,.18);color:#fde68a}
.b-het{background:rgba(148,163,184,.12);color:#94a3b8}
.date{font-size:11.5px;color:var(--mu);white-space:nowrap}
.title{
  font-size:1.05rem;font-weight:700;line-height:1.4;margin:0 0 8px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.title.full{-webkit-line-clamp:unset}
.body{
  font-size:13.5px;line-height:1.65;color:#b6c3d6;white-space:pre-wrap;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;
}
.body.full{-webkit-line-clamp:unset}
.more{
  margin-top:6px;font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;border:none;
  background:none;font-family:inherit;padding:0;
}
.more:hover{text-decoration:underline}

.preview-box{
  margin-top:12px;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:#0b1220;position:relative;
}
.preview-box img{
  display:block;width:100%;max-height:420px;object-fit:contain;background:#0b1220;
}
.preview-box iframe{
  display:block;width:100%;height:min(70vh,520px);border:0;background:#0b1220;
}
.preview-label{
  position:absolute;top:10px;left:10px;z-index:2;
  font-size:10px;font-weight:700;padding:4px 8px;border-radius:8px;
  background:rgba(15,23,42,.75);color:#cbd5e1;backdrop-filter:blur(6px);
}
.preview-actions{
  display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;border-top:1px solid var(--line);
  background:rgba(15,23,42,.5);
}

.foot{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
}
.dl{
  display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#fff;
  text-decoration:none;padding:9px 14px;border-radius:11px;
  background:linear-gradient(135deg,#0ea5e9,#0369a1);box-shadow:0 4px 14px rgba(14,165,233,.25);
  border:none;cursor:pointer;font-family:inherit;
}
.dl:hover{filter:brightness(1.06)}
.dl.sec{background:linear-gradient(135deg,#64748b,#334155);box-shadow:none}
.dl.ghost{
  background:transparent;border:1px solid var(--line);color:#cbd5e1;box-shadow:none;
}
.author{font-size:11.5px;color:var(--mu);margin-left:auto}

.empty{
  text-align:center;padding:52px 16px;color:var(--mu);
  border:1px dashed var(--line);border-radius:18px;background:rgba(21,29,46,.4);
}
.empty i{font-size:28px;margin-bottom:10px;opacity:.45;display:block}

/* Modal preview full */
.modal-bg{
  position:fixed;inset:0;background:rgba(2,6,23,.82);z-index:80;
  display:none;align-items:center;justify-content:center;padding:12px;
  backdrop-filter:blur(6px);
}
.modal-bg.show{display:flex}
.modal{
  width:min(960px,100%);max-height:92vh;background:#0f172a;border:1px solid var(--line);
  border-radius:16px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 24px 64px rgba(0,0,0,.45);
}
.modal-h{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;border-bottom:1px solid var(--line);background:#151d2e;
}
.modal-h b{font-size:13px;font-weight:700}
.modal-x{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);color:#fff;cursor:pointer;font-size:16px;
}
.modal-body{flex:1;min-height:0;background:#020617}
.modal-body iframe,.modal-body img{width:100%;height:min(80vh,720px);border:0;display:block;object-fit:contain}

@media print{
  .toolbar,.nav,.btn,.dl.ghost,.more{display:none!important}
  body{background:#fff;color:#000}
  .card{break-inside:avoid;border:1px solid #ccc;box-shadow:none;background:#fff}
  .title,.body,.date{color:#000}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1><i class="fa-solid fa-bullhorn" style="color:#38bdf8"></i> Thông báo · Niêm yết</h1>
      <p>BQLRPH Xuân Lộc</p>
    </div>
    <div class="nav"><a href="menu.html"><i class="fa-solid fa-house"></i> Menu</a></div>
  </div>

  <div class="toolbar">
    <div class="tabs" id="tabs">
      <button type="button" class="tab on" data-f="all">Tất cả</button>
      <button type="button" class="tab" data-f="thongbao">Thông báo</button>
      <button type="button" class="tab" data-f="niemyet">Niêm yết VB</button>
      <button type="button" class="tab" data-f="quantong">Tin quan trọng</button>
      <button type="button" class="tab" data-f="hoatdong">Hoạt động</button>
    </div>
    <div class="search-wrap">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input class="search" id="q" placeholder="Tìm…" oninput="render()">
    </div>
    <button type="button" class="btn" onclick="loadData()"><i class="fa-solid fa-rotate"></i> Làm mới</button>
  </div>

  <div class="meta" id="meta">Đang tải…</div>
  <div class="grid" id="list"></div>
</div>

<div class="modal-bg" id="previewModal" onclick="if(event.target===this)closePreview()">
  <div class="modal">
    <div class="modal-h">
      <b id="previewTitle">Xem trước</b>
      <button type="button" class="modal-x" onclick="closePreview()" aria-label="Đóng">&times;</button>
    </div>
    <div class="modal-body" id="previewBody"></div>
  </div>
</div>

<script>
(function(){
  var TYPE_META={
    thongbao:{label:'Thông báo',cls:'b-thongbao',icon:'fa-bell'},
    niemyet:{label:'Niêm yết VB',cls:'b-niemyet',icon:'fa-scroll'},
    quantong:{label:'Tin quan trọng',cls:'b-quantong',icon:'fa-triangle-exclamation'},
    hoatdong:{label:'Hoạt động',cls:'b-hoatdong',icon:'fa-people-group'}
  };
  var items=[], filter='all';
  var STORAGE_KEY='bqlrph_thongbao_sheet';
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxuJbK3_-8105VI5dWHkQCiR6BKUMmrf1RM33fQ6hbl9OGh06hGBk62shVWX3h2lBJC7g/exec';

  function sheetUrlFromCfg(t){
    if(!t) return '';
    if(t.url) return t.url;
    if(t.sid) return 'https://docs.google.com/spreadsheets/d/'+t.sid+'/edit'+(t.gid?('?gid='+t.gid+'#gid='+t.gid):'');
    return '';
  }
  function getSheetUrlLocal(){
    try{
      var shared=JSON.parse(localStorage.getItem('bqlrph_sheet_sources_v1')||'{}');
      var u=sheetUrlFromCfg(shared.thongbao);
      if(u) return u;
    }catch(e){}
    try{ return localStorage.getItem(STORAGE_KEY)||''; }catch(e){ return ''; }
  }
  function fetchSheetUrlCloud(){
    if(!SCRIPT_URL) return Promise.resolve('');
    return fetch(SCRIPT_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'getsheets'}),
      redirect:'follow'
    }).then(function(r){return r.text()}).then(function(txt){
      try{
        var res=JSON.parse(txt);
        if(res&&res.ok&&res.sheets&&res.sheets.thongbao){
          var u=sheetUrlFromCfg(res.sheets.thongbao);
          if(u){
            try{
              var all=JSON.parse(localStorage.getItem('bqlrph_sheet_sources_v1')||'{}');
              all.thongbao=res.sheets.thongbao;
              localStorage.setItem('bqlrph_sheet_sources_v1',JSON.stringify(all));
            }catch(e){}
            return u;
          }
        }
      }catch(e){}
      return '';
    }).catch(function(){return ''});
  }

  function parseSheetId(url){ var m=String(url).match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/); return m?m[1]:''; }
  function parseGid(url){ var m=String(url).match(/[?&#]gid=([0-9]+)/); return m?m[1]:'0'; }
  function cell(c){ if(!c)return ''; var v=c.f!=null?c.f:c.v; return v==null?'':String(v).trim(); }
  function normType(s){
    s=String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'');
    if(/niem|niemyet/.test(s)) return 'niemyet';
    if(/quan|khan|quantong|important/.test(s)) return 'quantong';
    if(/hoat|activity|hoatdong/.test(s)) return 'hoatdong';
    return 'thongbao';
  }
  function parseDate(s){
    s=String(s||'').trim(); if(!s) return null;
    var m=s.match(/Date\((\d+),(\d+),(\d+)/); if(m) return new Date(+m[1],+m[2],+m[3]);
    m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return new Date(+m[3],+m[2]-1,+m[1]);
    m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
    var d=new Date(s); return isNaN(d)?null:d;
  }
  function fmtDate(d){
    if(!d) return '';
    return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
  }
  function isTruthy(s){
    s=String(s||'').trim().toLowerCase();
    return s==='1'||s==='x'||s==='true'||s==='co'||s==='có'||s==='yes'||s==='hien'||s==='hiện';
  }
  function absUrl(u){
    if(!u) return '';
    u=String(u).trim();
    if(/^https?:\/\//i.test(u)||/^mailto:/i.test(u)) return u;
    return 'https://'+u;
  }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  }
  function isImageUrl(u){
    u=String(u||'');
    return /\.(png|jpe?g|gif|webp|bmp)(\?|$)/i.test(u)||/googleusercontent\.com|lh3\.google/i.test(u);
  }
  function driveFileId(u){
    u=String(u||'');
    var m=u.match(/\/file\/d\/([^/]+)/);
    if(m) return m[1];
    m=u.match(/[?&]id=([^&]+)/);
    if(m) return m[1];
    m=u.match(/\/uc\?export=download&id=([^&]+)/);
    if(m) return m[1];
    return '';
  }
  function previewUrl(u){
    u=absUrl(u);
    if(!u) return '';
    if(isImageUrl(u)) return {type:'image', url:u};
    var id=driveFileId(u);
    if(id) return {type:'drive', url:'https://drive.google.com/file/d/'+id+'/preview', download:'https://drive.google.com/uc?export=download&id='+id};
    if(/\.pdf(\?|$)/i.test(u)) return {type:'pdf', url:u};
    return {type:'link', url:u};
  }

  function mapHeader(cols){
    var idx={};
    cols.forEach(function(c,i){
      var h=String(c.label||c.id||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      if(/loai|type/.test(h)) idx.type=i;
      else if(/tieu de|title|trich/.test(h)) idx.title=i;
      else if(/noi dung|content|tom tat/.test(h)) idx.body=i;
      else if(/ngay dang|posted|date/.test(h)&&idx.date==null) idx.date=i;
      else if(/het han|expire/.test(h)) idx.exp=i;
      else if(/link|file|dinh kem|van ban|url|drive/.test(h)&&idx.link==null) idx.link=i;
      else if(/anh|hinh|image|photo/.test(h)) idx.image=i;
      else if(/nguoi|author|dang boi/.test(h)) idx.author=i;
      else if(/ghim|pin/.test(h)) idx.pin=i;
      else if(/hien|status|trang thai/.test(h)) idx.show=i;
    });
    if(idx.type==null)idx.type=1; if(idx.title==null)idx.title=2; if(idx.body==null)idx.body=3;
    if(idx.date==null)idx.date=4; if(idx.exp==null)idx.exp=5; if(idx.link==null)idx.link=6;
    if(idx.image==null)idx.image=7; if(idx.author==null)idx.author=8; if(idx.pin==null)idx.pin=9; if(idx.show==null)idx.show=10;
    return idx;
  }

  function fetchGviz(sheetId,gid){
    return new Promise(function(resolve,reject){
      var cb='bqlrphTb_'+Date.now();
      var url='https://docs.google.com/spreadsheets/d/'+sheetId+'/gviz/tq?tqx=responseHandler:'+cb+'&headers=1';
      if(gid) url+='&gid='+encodeURIComponent(gid);
      window[cb]=function(json){
        try{delete window[cb]}catch(e){}
        if(script&&script.parentNode)script.parentNode.removeChild(script);
        if(!json||!json.table) return reject(new Error('Sheet rỗng'));
        resolve(json.table);
      };
      var script=document.createElement('script');
      script.onerror=function(){reject(new Error('Không tải được Sheet'));};
      script.src=url; document.body.appendChild(script);
      setTimeout(function(){ if(window[cb]){try{delete window[cb]}catch(e){} reject(new Error('Timeout'));}},15000);
    });
  }

  function sampleData(){ return []; }

  function loadFromUrl(url){
    if(!url){ items=[]; render(); return; }
    var id=parseSheetId(url); if(!id){ items=[]; render(); return; }
    fetchGviz(id, parseGid(url)).then(function(table){
      var idx=mapHeader(table.cols||[]);
      var out=[];
      (table.rows||[]).forEach(function(r){
        var c=r.c||[];
        var title=cell(c[idx.title]); if(!title) return;
        var showRaw=cell(c[idx.show]); if(showRaw!=='' && !isTruthy(showRaw)) return;
        var link=cell(c[idx.link]), image=cell(c[idx.image]);
        if(!image && link && isImageUrl(link)) image=link;
        out.push({
          type:normType(cell(c[idx.type])), title:title, body:cell(c[idx.body]),
          date:parseDate(cell(c[idx.date])), exp:parseDate(cell(c[idx.exp])),
          link:link, image:image, author:cell(c[idx.author]), pin:isTruthy(cell(c[idx.pin]))
        });
      });
      items=out;
      render();
    }).catch(function(){ items=[]; render(); document.getElementById('meta').textContent='Không đọc được dữ liệu (kiểm tra chia sẻ Sheet)'; });
  }

  function loadData(){
    document.getElementById('meta').textContent='Đang tải…';
    var local=getSheetUrlLocal();
    var done=false;
    function finishEmpty(msg){
      if(done) return;
      done=true;
      items=[];
      render();
      document.getElementById('meta').textContent=msg||'Không có dữ liệu';
    }
    function tryUrl(url){
      if(!url) return;
      loadFromUrl(url);
      done=true;
    }
    if(local) tryUrl(local);
    var cloudWait=fetchSheetUrlCloud().then(function(cloud){
      var url=cloud||local||'';
      if(!url){ finishEmpty('Chưa cấu hình nguồn Thông báo'); return; }
      if(!local || (cloud && cloud!==local)) tryUrl(url);
      else if(local) done=true;
    }).catch(function(){
      if(!local) finishEmpty('Không kết nối được máy chủ cấu hình');
    });
    setTimeout(function(){
      if(!done) finishEmpty('Hết thời gian tải — kiểm tra chia sẻ Sheet hoặc bấm Làm mới');
    }, 12000);
  }
  window.loadData=loadData;

  document.getElementById('tabs').addEventListener('click',function(e){
    var btn=e.target.closest('.tab'); if(!btn) return;
    filter=btn.getAttribute('data-f')||'all';
    [].forEach.call(document.querySelectorAll('.tab'),function(t){t.classList.toggle('on',t===btn)});
    render();
  });

  window.toggleClamp=function(id, which){
    var el=document.getElementById(which+'-'+id);
    var btn=document.getElementById(which+'-btn-'+id);
    if(!el) return;
    el.classList.toggle('full');
    if(btn) btn.textContent=el.classList.contains('full')?'Thu gọn':'Xem thêm';
  };

  window.openPreview=function(url, title){
    var p=previewUrl(url);
    var body=document.getElementById('previewBody');
    document.getElementById('previewTitle').textContent=title||'Xem trước';
    if(p.type==='image'){
      body.innerHTML='<img src="'+escapeHtml(p.url)+'" alt="">';
    } else if(p.type==='drive'||p.type==='pdf'){
      body.innerHTML='<iframe src="'+escapeHtml(p.url)+'" allow="autoplay"></iframe>';
    } else {
      body.innerHTML='<div style="padding:24px;color:#94a3b8;text-align:center">Không nhúng được. <a style="color:#38bdf8" href="'+escapeHtml(p.url)+'" target="_blank" rel="noopener">Mở liên kết</a></div>';
    }
    document.getElementById('previewModal').classList.add('show');
  };
  window.closePreview=function(){
    document.getElementById('previewModal').classList.remove('show');
    document.getElementById('previewBody').innerHTML='';
  };

  function renderPreviewBlock(it, idx){
    var src=it.image||it.link;
    if(!src) return '';
    var p=previewUrl(src);
    var html='<div class="preview-box">';
    if(p.type==='image' || (it.image && isImageUrl(it.image))){
      var imgU=absUrl(it.image||src);
      html+='<span class="preview-label"><i class="fa-solid fa-image"></i> Ảnh</span>';
      html+='<img src="'+escapeHtml(imgU)+'" alt="" loading="lazy" onclick="openPreview(\''+escapeHtml(imgU).replace(/'/g,"\\'")+'\',\'Ảnh đính kèm\')" style="cursor:zoom-in">';
    } else if(p.type==='drive'||p.type==='pdf'){
      html+='<span class="preview-label"><i class="fa-solid fa-file-pdf"></i> Văn bản</span>';
      html+='<iframe src="'+escapeHtml(p.url)+'" title="Xem trước văn bản"></iframe>';
    }
    html+='<div class="preview-actions">';
    if(p.type==='drive'||p.type==='pdf'||p.type==='image'){
      html+='<button type="button" class="dl ghost" onclick="openPreview(\''+escapeHtml(src).replace(/'/g,"\\'")+'\',\''+escapeHtml(it.title||'Xem trước').replace(/'/g,"\\'")+'\')"><i class="fa-solid fa-expand"></i> Phóng to</button>';
    }
    var dl=p.download||absUrl(it.link||src);
    if(dl) html+='<a class="dl" href="'+escapeHtml(dl)+'" target="_blank" rel="noopener"><i class="fa-solid fa-download"></i> Tải về</a>';
    html+='</div></div>';
    // only show embedded preview if we can render something
    if(p.type==='link' && !it.image) return '';
    return html;
  }

  function render(){
    var q=(document.getElementById('q').value||'').toLowerCase().trim();
    var now=new Date(); now.setHours(0,0,0,0);
    var list=items.filter(function(it){
      if(filter!=='all'&&it.type!==filter) return false;
      if(!q) return true;
      return (it.title+' '+it.body+' '+(it.author||'')).toLowerCase().indexOf(q)>=0;
    });
    list.sort(function(a,b){
      if(a.pin!==b.pin) return a.pin?-1:1;
      return (b.date?b.date.getTime():0)-(a.date?a.date.getTime():0);
    });
    document.getElementById('meta').textContent=list.length+' tin';
    var box=document.getElementById('list');
    if(!list.length){
      box.innerHTML='<div class="empty"><i class="fa-regular fa-folder-open"></i>Chưa có tin hiển thị</div>';
      return;
    }
    box.innerHTML=list.map(function(it,idx){
      var tm=TYPE_META[it.type]||TYPE_META.thongbao;
      var expired=it.exp&&it.exp<now;
      var badges='<span class="badge '+tm.cls+'"><i class="fa-solid '+tm.icon+'"></i> '+tm.label+'</span>';
      if(it.pin) badges+='<span class="badge b-pin"><i class="fa-solid fa-thumbtack"></i> Ghim</span>';
      if(expired) badges+='<span class="badge b-het">Hết hạn</span>';
      var dates=[];
      if(it.date) dates.push('Đăng: '+fmtDate(it.date));
      if(it.exp) dates.push('Hết hạn: '+fmtDate(it.exp));

      // Avoid duplicate title/body when admin pasted same text
      var body=it.body||'';
      if(body && it.title && body.replace(/\s+/g,'')===it.title.replace(/\s+/g,'')) body='';

      var titleLong=it.title && it.title.length>120;
      var bodyLong=body && body.length>280;
      var titleHtml='<div class="title" id="title-'+idx+'">'+escapeHtml(it.title)+'</div>';
      if(titleLong) titleHtml+='<button type="button" class="more" id="title-btn-'+idx+'" onclick="toggleClamp('+idx+',\'title\')">Xem thêm</button>';
      var bodyHtml='';
      if(body){
        bodyHtml='<div class="body" id="body-'+idx+'">'+escapeHtml(body)+'</div>';
        if(bodyLong) bodyHtml+='<button type="button" class="more" id="body-btn-'+idx+'" onclick="toggleClamp('+idx+',\'body\')">Xem thêm</button>';
      }

      var prev=renderPreviewBlock(it, idx);
      var dls='';
      if(it.link){
        var p=previewUrl(it.link);
        var dl=p.download||absUrl(it.link);
        dls+='<a class="dl" href="'+escapeHtml(dl)+'" target="_blank" rel="noopener"><i class="fa-solid fa-download"></i> Tải văn bản</a>';
        if(p.type==='drive'||p.type==='pdf'){
          dls+='<button type="button" class="dl sec" onclick="openPreview(\''+escapeHtml(it.link).replace(/'/g,"\\'")+'\',\''+escapeHtml(it.title||'').replace(/'/g,"\\'")+'\')"><i class="fa-solid fa-eye"></i> Xem văn bản</button>';
        }
      }
      if(it.image){
        dls+='<a class="dl sec" href="'+escapeHtml(absUrl(it.image))+'" target="_blank" rel="noopener"><i class="fa-solid fa-image"></i> Tải ảnh</a>';
      }

      return '<article class="card'+(it.pin?' pin':'')+(expired?' expired':'')+'"><div class="card-body">'+
        '<div class="head"><div class="badges">'+badges+'</div><div class="date">'+escapeHtml(dates.join(' · '))+'</div></div>'+
        titleHtml+bodyHtml+prev+
        '<div class="foot">'+dls+'<span class="author">'+escapeHtml(it.author||'')+'</span></div>'+
      '</div></article>';
    }).join('');
  }
  window.render=render;

  loadData();
})();
</script>
</body>
</html>
