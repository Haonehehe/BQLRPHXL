<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tra cứu pháp luật lâm nghiệp · BQLRPH Xuân Lộc</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f5f9;--card:#fff;--bd:#e2e8f0;--tx:#0f172a;--mu:#64748b;
  --ind:#4f46e5;--g:#059669;--amber:#d97706;--red:#dc2626;
  --shadow:0 8px 28px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--tx);min-height:100vh;
  background:radial-gradient(900px 420px at 0% -10%,#e0e7ff 0%,transparent 55%),
    radial-gradient(700px 360px at 100% 0%,#d1fae5 0%,transparent 50%),var(--bg);
  padding-bottom:48px;
}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.top{
  position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--bd);box-shadow:0 4px 18px rgba(15,23,42,.04);
}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}
.logo-i{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:18px;
  background:linear-gradient(135deg,#6366f1,#4338ca);box-shadow:0 8px 20px rgba(99,102,241,.35);
}
.logo h1{font-size:16.5px;font-weight:800}
.logo p{font-size:11.5px;color:var(--mu);margin-top:2px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{
  height:38px;padding:0 14px;border-radius:12px;border:1px solid transparent;
  font:600 12.5px/1 "Be Vietnam Pro",system-ui;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:inherit;
  transition:transform .15s,filter .15s,box-shadow .2s;
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.03)}
.btn-o{background:#fff;border-color:var(--bd);color:#334155}
.btn-b{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.28)}
.btn-g{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.btn-sm{height:32px;padding:0 11px;font-size:12px;border-radius:10px}

.note{
  margin:14px 0 10px;padding:12px 14px;border-radius:14px;font-size:12.5px;line-height:1.55;color:#334155;
  background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(16,185,129,.06));
  border:1px solid rgba(99,102,241,.18);
}
.bar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0 10px;
  padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--shadow);
}
.bar input[type=search],.bar select{
  height:40px;border-radius:12px;border:1px solid var(--bd);padding:0 12px;
  font:500 13px "Be Vietnam Pro",system-ui;background:#f8fafc;outline:none;
}
.bar input[type=search]{flex:1;min-width:200px}
.bar input:focus,.bar select:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(99,102,241,.15);background:#fff}
.bar select{min-width:130px}
.sync{font-size:12px;color:var(--mu);padding:6px 10px;border-radius:999px;background:#f1f5f9;border:1px solid var(--bd);white-space:nowrap}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{
  height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--bd);background:#fff;
  font:600 11.5px "Be Vietnam Pro",system-ui;color:#475569;cursor:pointer;
}
.chip.on{background:#312e81;color:#fff;border-color:#312e81}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--mu)}
.kpi .v{font-size:20px;font-weight:800;margin-top:2px;color:#4338ca}

.layout{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:960px){
  .layout.with-detail{grid-template-columns:minmax(0,1fr) minmax(320px,400px)}
}

.list{display:flex;flex-direction:column;gap:10px}
.card{
  background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 15px;
  box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s,box-shadow .2s,transform .15s;
  text-align:left;width:100%;font:inherit;color:inherit;
}
.card:hover{border-color:#c7d2fe;box-shadow:0 10px 28px rgba(99,102,241,.1)}
.card.active{border-color:#6366f1;box-shadow:0 0 0 2px rgba(99,102,241,.2)}
.card-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.badge{
  display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;
  font-size:10.5px;font-weight:700;border:1px solid transparent;white-space:nowrap;
}
.badge.law{background:#eef2ff;color:#4338ca;border-color:#c7d2fe}
.badge.nd{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.badge.tt{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.badge.vbhn{background:#fff7ed;color:#c2410c;border-color:#fed7aa}
.badge.tcvn{background:#faf5ff;color:#7e22ce;border-color:#e9d5ff}
.badge.other{background:#f1f5f9;color:#475569;border-color:#e2e8f0}
.badge.ok{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.badge.part{background:#fffbeb;color:#b45309;border-color:#fde68a}
.badge.off{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.so{font-weight:800;font-size:13.5px}
.ten{font-size:13.5px;font-weight:700;line-height:1.4;margin:2px 0 6px}
.meta{font-size:11.5px;color:var(--mu);display:flex;flex-wrap:wrap;gap:8px 12px}
.trich-short{font-size:12.5px;color:#475569;line-height:1.45;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mark{background:#fef08a;padding:0 2px;border-radius:3px}

.detail{
  background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--shadow);
  position:sticky;top:72px;max-height:calc(100vh - 90px);overflow:auto;padding:16px;
}
.detail.empty{display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--mu);font-size:13px;text-align:center;padding:24px}
.detail h2{font-size:15px;font-weight:800;line-height:1.4;margin:8px 0 10px}
.detail .so-lg{font-size:18px;font-weight:800;color:#312e81}
.dl{display:grid;gap:10px;margin:12px 0}
.dl .row{padding:10px 12px;border-radius:12px;background:#f8fafc;border:1px solid var(--bd)}
.dl .k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--mu);margin-bottom:4px}
.dl .v{font-size:13px;line-height:1.55;color:#1e293b;white-space:pre-wrap;word-break:break-word}
.related{margin-top:12px}
.related h3{font-size:12px;font-weight:800;color:var(--mu);text-transform:uppercase;margin-bottom:8px}
.rel-item{
  display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:6px;border-radius:10px;
  border:1px solid var(--bd);background:#fff;font:600 12px "Be Vietnam Pro",system-ui;cursor:pointer;color:#312e81;
}
.rel-item:hover{border-color:#a5b4fc;background:#eef2ff}
.pager{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.pager button{min-width:36px}
.pager span{font-size:12.5px;color:var(--mu)}
.muted{text-align:center;color:var(--mu);padding:28px;font-size:13px}
#toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(16px);
  background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:0 10px 28px rgba(0,0,0,.25);
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;font-size:11.5px;color:var(--mu);margin-top:16px}
@media(max-width:959px){
  .detail{position:fixed;inset:auto 0 0 0;top:auto;max-height:78vh;z-index:50;border-radius:18px 18px 0 0;
    transform:translateY(110%);transition:transform .25s;box-shadow:0 -12px 40px rgba(0,0,0,.2)}
  .detail.open{transform:translateY(0)}
  .detail-close{display:inline-flex!important}
}
.detail-close{display:none}
</style>
</head>
<body>
<div class="top">
  <div class="wrap top-in">
    <div class="logo">
      <div class="logo-i"><i class="fa-solid fa-scale-balanced"></i></div>
      <div>
        <h1>Tra cứu pháp luật lâm nghiệp</h1>
        
      </div>
    </div>
    <div class="acts">
      <a class="btn btn-o" href="menu.html"><i class="fa-solid fa-house"></i> Menu</a>
      <button class="btn btn-o" type="button" onclick="taiLai()"><i class="fa-solid fa-arrows-rotate" id="icoReload"></i> Làm mới</button>
      <a class="btn btn-b" target="_blank" rel="noopener" href="https://vbpl.vn/"><i class="fa-solid fa-landmark"></i> vbpl.vn</a>
    </div>
  </div>
</div>

<div class="wrap">
<div class="bar">
    <input type="search" id="q" placeholder="Tìm số hiệu, tên, trích yếu, lĩnh vực, ghi chú…" oninput="onSearch()">
    <select id="fLoai" onchange="veLai()"><option value="">Tất cả loại</option></select>
    <select id="fTT" onchange="veLai()">
      <option value="">Mọi hiệu lực</option>
      <option value="Còn hiệu lực">Còn hiệu lực</option>
      <option value="Hiệu lực một phần">Hiệu lực một phần</option>
      <option value="Hết hiệu lực">Hết hiệu lực</option>
    </select>
    <select id="fSort" onchange="veLai()">
      <option value="new">Mới → cũ</option>
      <option value="old">Cũ → mới</option>
      <option value="so">Theo số hiệu</option>
    </select>
    <span class="sync" id="syncTxt">Chưa tải</span>
  </div>

  <div class="chips" id="chips"></div>
  <div class="kpis" id="kpis"></div>

  <div class="layout" id="layout">
    <div>
      <div class="list" id="list"></div>
      <div class="pager" id="pager"></div>
    </div>
    <aside class="detail empty" id="detail">
      <div>Chọn một văn bản để xem <b>chi tiết đầy đủ</b></div>
    </aside>
  </div>
</div>
<div id="toast"></div>

<script>
var SID='13z-ujF-G03A_w0wOWdrRcns3a5JshzAI';
var GID='1138171418';
var dong=[];
var filtered=[];
var page=1;
var PAGE_SIZE=20;
var activeId=null;
var chipLV='';
var searchTimer=null;

function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('on');setTimeout(function(){e.classList.remove('on');},2600);}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function cellGviz(r,i){
  if(!r||!r.c||!r.c[i]) return '';
  var v=r.c[i];
  if(v.f!=null && String(v.f).trim()!=='') return String(v.f).trim();
  if(v.v==null) return '';
  return String(v.v).trim();
}
function onSearch(){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(function(){page=1;veLai();},180);
}

function badgeLoai(loai){
  var s=String(loai||'').toLowerCase();
  if(/luật/.test(s)) return 'law';
  if(/nghị định|nghi dinh/.test(s)) return 'nd';
  if(/thông tư|thong tu/.test(s)) return 'tt';
  if(/hợp nhất|hop nhat|vbhn/.test(s)) return 'vbhn';
  if(/tcvn|tiêu chuẩn/.test(s)) return 'tcvn';
  return 'other';
}
function badgeTT(tt){
  var s=String(tt||'').toLowerCase();
  if(/hết|het/.test(s)) return 'off';
  if(/một phần|mot phan/.test(s)) return 'part';
  if(/còn|con/.test(s)) return 'ok';
  return 'other';
}
function parseDate(s){
  s=String(s||'').trim();
  var m=s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m) return new Date(+m[3],+m[2]-1,+m[1]);
  m=s.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  var d=new Date(s);
  return isNaN(d.getTime())?null:d;
}
function hl(text,q){
  text=esc(text||'');
  if(!q) return text;
  var parts=q.trim().split(/\s+/).filter(Boolean);
  parts.forEach(function(w){
    var re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    text=text.replace(re,'<span class="mark">$1</span>');
  });
  return text;
}

function fetchGviz(){
  return new Promise(function(resolve,reject){
    var cb='pl_'+Math.floor(Math.random()*1e9);
    var sc=document.createElement('script');
    var to=setTimeout(function(){cleanup();reject(new Error('Timeout tải Sheet'));},45000);
    function cleanup(){
      clearTimeout(to);
      try{delete window[cb];}catch(e){window[cb]=undefined;}
      if(sc.parentNode) sc.parentNode.removeChild(sc);
    }
    window[cb]=function(resp){
      cleanup();
      try{
        if(!resp||!resp.table||!resp.table.rows) throw new Error('Sheet rỗng');
        var out=[];
        resp.table.rows.forEach(function(r,idx){
          var so=cellGviz(r,1), ten=cellGviz(r,4);
          if(!so && !ten) return;
          if(/số hiệu|tên văn bản/i.test(so+ten)) return;
          out.push({
            id:'vb_'+idx,
            stt:cellGviz(r,0),
            so:so,
            loai:cellGviz(r,2),
            coQuan:cellGviz(r,3),
            ten:ten,
            ngay:cellGviz(r,5),
            ngayD:parseDate(cellGviz(r,5)),
            linhVuc:cellGviz(r,6),
            trich:cellGviz(r,7),
            tinhTrang:cellGviz(r,8),
            suaDoi:cellGviz(r,9),
            ghiChu:cellGviz(r,10),
            link:cellGviz(r,11)
          });
        });
        resolve(out);
      }catch(e){reject(e);}
    };
    sc.onerror=function(){cleanup();reject(new Error('Lỗi tải Sheet — cần chia sẻ Anyone with the link'));};
    sc.src='https://docs.google.com/spreadsheets/d/'+SID+'/gviz/tq?tqx=responseHandler:'+cb+'&headers=1&gid='+encodeURIComponent(GID)+'&_t='+Date.now();
    document.head.appendChild(sc);
  });
}

function taiLai(silent){
  var ic=document.getElementById('icoReload');
  if(ic) ic.classList.add('fa-spin');
  document.getElementById('syncTxt').textContent='Đang tải…';
  fetchGviz().then(function(rows){
    dong=rows;
    napBoLoc();
    page=1;
    veLai();
    document.getElementById('syncTxt').textContent=dong.length+' văn bản · '+new Date().toLocaleTimeString('vi-VN');
    if(!silent) toast('Đã tải '+dong.length+' văn bản');
  }).catch(function(e){
    document.getElementById('syncTxt').textContent='Lỗi tải';
    if(!silent) toast(e.message||'Không tải được');
  }).then(function(){if(ic) ic.classList.remove('fa-spin');});
}

function napBoLoc(){
  var loai={}, lvCount={};
  dong.forEach(function(d){
    if(d.loai) loai[d.loai]=1;
    if(d.linhVuc) lvCount[d.linhVuc]=(lvCount[d.linhVuc]||0)+1;
  });
  var s1=document.getElementById('fLoai'), c1=s1.value;
  s1.innerHTML='<option value="">Tất cả loại</option>'+Object.keys(loai).sort().map(function(k){return '<option value="'+esc(k)+'">'+esc(k)+'</option>';}).join('');
  if(c1) s1.value=c1;

  var chips=[{k:'',label:'Tất cả'}];
  Object.keys(lvCount).sort(function(a,b){return lvCount[b]-lvCount[a];}).slice(0,12).forEach(function(k){
    chips.push({k:k,label:k.length>28?k.slice(0,28)+'…':k});
  });
  document.getElementById('chips').innerHTML=chips.map(function(c){
    return '<button type="button" class="chip'+(chipLV===c.k?' on':'')+'" onclick="setChip(this,\''+esc(c.k).replace(/'/g,"\\'")+'\')">'+esc(c.label)+'</button>';
  }).join('');
}
function setChip(btn,k){
  chipLV=k;
  document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on');});
  btn.classList.add('on');
  page=1; veLai();
}

function locDong(){
  var q=(document.getElementById('q').value||'').toLowerCase().trim();
  var fLoai=document.getElementById('fLoai').value;
  var fTT=document.getElementById('fTT').value;
  var sort=document.getElementById('fSort').value;
  var list=dong.filter(function(d){
    if(fLoai && d.loai!==fLoai) return false;
    if(chipLV && d.linhVuc!==chipLV) return false;
    if(fTT){
      var t=String(d.tinhTrang||'');
      if(fTT==='Còn hiệu lực' && !(/còn hiệu lực/i.test(t) && !/một phần/i.test(t))) return false;
      if(fTT==='Hiệu lực một phần' && !/một phần/i.test(t)) return false;
      if(fTT==='Hết hiệu lực' && !/hết hiệu lực/i.test(t)) return false;
    }
    if(!q) return true;
    var bag=[d.so,d.ten,d.trich,d.linhVuc,d.coQuan,d.ghiChu,d.suaDoi,d.loai,d.tinhTrang].join(' ').toLowerCase();
    return q.split(/\s+/).every(function(w){return bag.indexOf(w)>=0;});
  });
  list.sort(function(a,b){
    if(sort==='so') return String(a.so).localeCompare(String(b.so),'vi');
    var da=a.ngayD?a.ngayD.getTime():0, db=b.ngayD?b.ngayD.getTime():0;
    return sort==='old'?da-db:db-da;
  });
  return list;
}

function veLai(){
  filtered=locDong();
  var ok=0,part=0,off=0,law=0;
  filtered.forEach(function(d){
    var t=String(d.tinhTrang||'').toLowerCase();
    if(/hết/.test(t)) off++;
    else if(/một phần/.test(t)) part++;
    else if(/còn/.test(t)) ok++;
    if(/luật/i.test(d.loai||'')) law++;
  });
  document.getElementById('kpis').innerHTML=
    '<div class="kpi"><div class="l">Kết quả</div><div class="v">'+filtered.length+'</div></div>'+
    '<div class="kpi"><div class="l">Còn hiệu lực</div><div class="v" style="color:#059669">'+ok+'</div></div>'+
    '<div class="kpi"><div class="l">Một phần</div><div class="v" style="color:#d97706">'+part+'</div></div>'+
    '<div class="kpi"><div class="l">Hết hiệu lực</div><div class="v" style="color:#dc2626">'+off+'</div></div>'+
    '<div class="kpi"><div class="l">Luật</div><div class="v">'+law+'</div></div>';

  var pages=Math.max(1, Math.ceil(filtered.length/PAGE_SIZE));
  if(page>pages) page=pages;
  var start=(page-1)*PAGE_SIZE;
  var slice=filtered.slice(start, start+PAGE_SIZE);
  var q=(document.getElementById('q').value||'').trim();

  if(!slice.length){
    document.getElementById('list').innerHTML='<div class="muted">Không có văn bản khớp bộ lọc</div>';
  } else {
    document.getElementById('list').innerHTML=slice.map(function(d){
      return '<button type="button" class="card'+(activeId===d.id?' active':'')+'" onclick="moChiTiet(\''+d.id+'\')">'+
        '<div class="card-top">'+
          '<span class="badge '+badgeLoai(d.loai)+'">'+esc(d.loai||'VB')+'</span>'+
          '<span class="badge '+badgeTT(d.tinhTrang)+'">'+esc(d.tinhTrang||'—')+'</span>'+
          '<span class="so">'+hl(d.so,q)+'</span>'+
        '</div>'+
        '<div class="ten">'+hl(d.ten,q)+'</div>'+
        '<div class="meta">'+
          (d.ngay?'<span><i class="fa-regular fa-calendar"></i> '+esc(d.ngay)+'</span>':'')+
          (d.linhVuc?'<span><i class="fa-solid fa-tags"></i> '+esc(d.linhVuc)+'</span>':'')+
          (d.coQuan?'<span><i class="fa-solid fa-building-columns"></i> '+esc(d.coQuan)+'</span>':'')+
        '</div>'+
        (d.trich?'<div class="trich-short">'+hl(d.trich,q)+'</div>':'')+
      '</button>';
    }).join('');
  }

  var ph='';
  if(pages>1){
    ph+='<button type="button" class="btn btn-o btn-sm" '+(page<=1?'disabled':'')+' onclick="goPage('+(page-1)+')">‹</button>';
    ph+='<span>Trang <b>'+page+'</b> / '+pages+' · '+filtered.length+' VB</span>';
    ph+='<button type="button" class="btn btn-o btn-sm" '+(page>=pages?'disabled':'')+' onclick="goPage('+(page+1)+')">›</button>';
  }
  document.getElementById('pager').innerHTML=ph;

  if(activeId){
    var still=dong.some(function(d){return d.id===activeId;});
    if(still) moChiTiet(activeId,true);
  }
}

function goPage(p){page=p;veLai();window.scrollTo({top:0,behavior:'smooth'});}

function findById(id){
  for(var i=0;i<dong.length;i++) if(dong[i].id===id) return dong[i];
  return null;
}
function findRelated(d){
  var text=[d.suaDoi,d.ghiChu,d.trich,d.ten].join(' ');
  var hits=[];
  dong.forEach(function(x){
    if(x.id===d.id||!x.so) return;
    var so=x.so.replace(/\s/g,'');
    if(so.length>=6 && text.indexOf(x.so)>=0) hits.push(x);
  });
  return hits.slice(0,8);
}

function moChiTiet(id,keepScroll){
  var d=findById(id);
  if(!d) return;
  activeId=id;
  document.querySelectorAll('.card').forEach(function(c){c.classList.remove('active');});
  var q=(document.getElementById('q').value||'').trim();
  var link=d.link||'';
  if(link && !/^https?:\/\//i.test(link)) link='https://'+link;
  var rel=findRelated(d);

  var box=document.getElementById('detail');
  document.getElementById('layout').classList.add('with-detail');
  box.classList.remove('empty');
  box.classList.add('open');
  box.innerHTML=
    '<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">'+
      '<div class="card-top" style="margin:0">'+
        '<span class="badge '+badgeLoai(d.loai)+'">'+esc(d.loai||'')+'</span>'+
        '<span class="badge '+badgeTT(d.tinhTrang)+'">'+esc(d.tinhTrang||'—')+'</span>'+
      '</div>'+
      '<button type="button" class="btn btn-o btn-sm detail-close" onclick="dongChiTiet()"><i class="fa-solid fa-xmark"></i></button>'+
    '</div>'+
    '<div class="so-lg">'+esc(d.so)+'</div>'+
    '<h2>'+esc(d.ten)+'</h2>'+
    '<div class="acts" style="margin-bottom:8px">'+
      (link?'<a class="btn btn-b btn-sm" href="'+esc(link)+'" target="_blank" rel="noopener"><i class="fa-solid fa-up-right-from-square"></i> Mở văn bản gốc</a>':'')+
      '<button type="button" class="btn btn-o btn-sm" onclick="copySo(\''+esc(d.so).replace(/'/g,"\\'")+'\')"><i class="fa-regular fa-copy"></i> Copy số hiệu</button>'+
      '<a class="btn btn-o btn-sm" href="https://vbpl.vn/" target="_blank" rel="noopener"><i class="fa-solid fa-magnifying-glass"></i> vbpl.vn</a>'+
    '</div>'+
    '<div class="dl">'+
      rowDL('Cơ quan ban hành', d.coQuan)+
      rowDL('Ngày ban hành', d.ngay)+
      rowDL('Lĩnh vực', d.linhVuc)+
      rowDL('Tình trạng hiệu lực', d.tinhTrang)+
      rowDL('Trích yếu / nội dung chính', d.trich)+
      rowDL('Sửa đổi / bổ sung / thay thế', d.suaDoi)+
      rowDL('Ghi chú', d.ghiChu)+
    '</div>'+
    (rel.length?'<div class="related"><h3>Văn bản liên quan (nhắc trong mô tả)</h3>'+
      rel.map(function(x){return '<button type="button" class="rel-item" onclick="moChiTiet(\''+x.id+'\')">'+esc(x.so)+' — '+esc((x.ten||'').slice(0,60))+'</button>';}).join('')+
    '</div>':'')+
    '';

  if(!keepScroll && window.innerWidth<960){
    box.scrollTop=0;
  }
  veLaiCardsActive();
}
function veLaiCardsActive(){
  document.querySelectorAll('.card').forEach(function(c){});
  // re-mark active after list re-render handled in veLai if needed
}
function rowDL(k,v){
  if(!v) return '';
  return '<div class="row"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>';
}
function dongChiTiet(){
  activeId=null;
  var box=document.getElementById('detail');
  box.classList.remove('open');
  box.classList.add('empty');
  box.innerHTML='<div>Chọn một văn bản để xem <b>chi tiết đầy đủ</b></div>';
  document.getElementById('layout').classList.remove('with-detail');
  document.querySelectorAll('.card').forEach(function(c){c.classList.remove('active');});
}
function copySo(so){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(so).then(function(){toast('Đã copy: '+so);}).catch(function(){toast(so);});
  } else toast(so);
}

window.taiLai=taiLai; window.veLai=veLai; window.moChiTiet=moChiTiet;
window.goPage=goPage; window.setChip=setChip; window.dongChiTiet=dongChiTiet;
window.copySo=copySo; window.onSearch=onSearch;

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){taiLai(true);});
else taiLai(true);
</script>
</body>
</html>
